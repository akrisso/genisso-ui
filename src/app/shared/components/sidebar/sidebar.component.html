
<div class="flex flex-col w-64 bg-[#3f0e40] hg-100 text-gray-200" style="height: 100%;">
  <!-- Workspace Header -->
  <div class="flex items-center justify-between p-3 border-b border-gray-700/50">
    <h1 class="text-lg font-bold">{{ workspaceName() }}</h1>
    <button class="p-2 rounded-full hover:bg-white/10" (click)="logout()">
      <i class="fa-solid fa-sign-out"></i>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto">
    <!-- Channels -->
    <div class="p-3">
      <h2 class="text-sm font-semibold text-gray-400 uppercase">Channels</h2>
      <ul class="mt-2 space-y-1">
        @for (channel of channels(); track channel.name) {
          <li 
            (click)="selectChannel(channel.name)"
            [class.bg-violet-600]="activeChannel() === channel.name"
            class="flex items-center px-3 py-1.5 rounded-md cursor-pointer hover:bg-white/10 transition-colors">
            <i [class]="channel.icon" class="w-5 mr-2 text-gray-400"></i>
            <span class="capitalize">{{ channel.name }}</span>
          </li>
        }
      </ul>
    </div>

    <!-- Direct Messages -->
    <div class="p-3">
      <h2 class="text-sm font-semibold text-gray-400 uppercase">Team</h2>
      <ul class="mt-2 space-y-1">
        @for (dm of directMessages(); track dm.name) {
          <li class="flex items-center px-3 py-1.5 rounded-md cursor-pointer hover:bg-white/10 transition-colors">
            <div class="relative mr-2">
              <img class="w-6 h-6 rounded-full" [src]="'https://i.pravatar.cc/40?u=' + dm.name" alt="avatar">
              @if (dm.online) {
                <span class="absolute bottom-0 right-0 block h-2 w-2 rounded-full bg-green-500 border-2 border-[#3f0e40]"></span>
              }
            </div>
            <span>{{ dm.name }}</span>
          </li>
        }
      </ul>
    </div>
  </div>

  <!-- User Profile -->
  <div class="p-3 border-t border-gray-700/50">
    <div class="flex items-center">
      <img class="w-8 h-8 rounded-md" [src]="'https://i.pravatar.cc/40?u=' + userName()" alt="User Avatar">
      <div class="ml-2">
        <p class="font-semibold">{{ userName() }}</p>
        <div class="flex items-center text-sm text-gray-400">
          <span class="h-2 w-2 bg-green-500 rounded-full mr-1.5"></span>
          Active
        </div>
      </div>
    </div>
  </div>
</div>
