
<header class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200">
  <div>
    <h2 class="text-xl font-bold capitalize flex items-center">
      <i class="fa-solid fa-hashtag text-gray-500 dark:text-gray-400 mr-2"></i>
      {{ channelName }}
    </h2>
    <p class="text-sm text-gray-500 dark:text-gray-400">Track organizations and metrics.</p>
  </div>
  <div class="flex items-center space-x-4">
    <div class="relative">
      <input type="text" placeholder="Search..." class="w-64 pl-10 pr-4 py-2 rounded-md bg-gray-100 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-violet-500">
      <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
    </div>
    <button class="p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700">
      <i class="fa-solid fa-circle-question text-lg"></i>
    </button>
  </div>
</header>
