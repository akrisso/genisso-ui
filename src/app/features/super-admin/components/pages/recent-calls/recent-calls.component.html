
<div class="bg-white dark:bg-gray-800 p-5 rounded-lg shadow-sm">
  <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-4">Recent Calls</h3>
  <div class="overflow-x-auto">
    <table class="w-full text-sm text-left text-gray-600 dark:text-gray-300">
      <thead class="text-xs text-gray-700 dark:text-gray-400 uppercase bg-gray-50 dark:bg-gray-700">
        <tr>
          <th scope="col" class="px-6 py-3"></th>
          <th scope="col" class="px-6 py-3">Contact</th>
          <th scope="col" class="px-6 py-3">Time</th>
          <th scope="col" class="px-6 py-3">Duration</th>
          <th scope="col" class="px-6 py-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (call of calls(); track call.id) {
          <tr class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
            <td class="px-6 py-4">
              <i [class]="'fa-solid ' + getCallIcon(call.type)"></i>
            </td>
            <td class="px-6 py-4 font-medium text-gray-900 dark:text-white whitespace-nowrap">
              <div class="flex items-center">
                <img class="w-8 h-8 rounded-full mr-3" [src]="'https://i.pravatar.cc/40?u=' + call.name" alt="avatar">
                <div>
                  <div>{{ call.name }}</div>
                  <div class="text-xs text-gray-500 dark:text-gray-400">{{ call.number }}</div>
                </div>
              </div>
            </td>
            <td class="px-6 py-4">{{ call.time }}</td>
            <td class="px-6 py-4">{{ call.duration }}</td>
            <td class="px-6 py-4 text-right">
              <button class="text-violet-600 dark:text-violet-400 hover:underline">Details</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
