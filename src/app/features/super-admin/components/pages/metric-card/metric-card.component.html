
<div class="bg-white dark:bg-gray-800 p-5 rounded-lg shadow-sm flex flex-col enter-container" animate.enter="enter-animation">
  <div class="flex items-center justify-between mb-2">
    <h3 class="text-sm font-medium text-gray-500 dark:text-gray-400">{{ title() }}</h3>
    <div class="w-8 h-8 flex items-center justify-center bg-violet-100 dark:bg-violet-900/50 rounded-full">
      <i [class]="'fa-solid ' + icon() + ' text-violet-500 dark:text-violet-400'"></i>
    </div>
  </div>
  <p class="text-3xl font-bold text-gray-800 dark:text-gray-100">{{ value() }}</p>
  <div class="mt-auto pt-2">
    @if (trendDirection() === 'up') {
      <p class="text-sm text-green-500 flex items-center">
        <i class="fa-solid fa-arrow-trend-up mr-1"></i>
        {{ trend() }} vs last month
      </p>
    } @else {
      <p class="text-sm text-red-500 flex items-center">
        <i class="fa-solid fa-arrow-trend-down mr-1"></i>
        {{ trend() }} vs last month
      </p>
    }
  </div>
</div>
