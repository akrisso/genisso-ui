
<div class="bg-white dark:bg-gray-800 p-5 rounded-lg shadow-sm h-full flex flex-col">
  <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-4 flex items-center">
    <i class="fa-solid fa-wand-magic-sparkles text-violet-500 mr-2"></i>
    Genisso Assistant
  </h3>
  <div class="flex flex-col flex-1">
    <label for="transcript" class="text-sm font-medium text-gray-600 dark:text-gray-300 mb-2">
      Start Interacting here:
    </label>
    <textarea 
      id="transcript"
      [ngModel]="callTranscript()" 
      (ngModelChange)="callTranscript.set($event)"
      rows="8"
      class="w-full p-2 text-sm rounded-md bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-violet-500 resize-none patient"></textarea>
    
    <button 
      (click)="getSummary()"
      [disabled]="state() === 'loading'"
      class="mt-4 w-full py-2 px-4 rounded-md font-semibold text-white bg-violet-600 hover:bg-violet-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-violet-500 dark:focus:ring-offset-gray-800 disabled:bg-violet-400 disabled:cursor-not-allowed transition-colors">
      @if (state() === 'loading') {
        <div class="flex items-center justify-center">
          <i class="fa-solid fa-spinner fa-spin mr-2"></i>
          <span>Analyzing...</span>
        </div>
      } @else {
        <span>Get Summary & Actions</span>
      }
    </button>
  </div>
  
  @if (state() !== 'idle') {
    <div class="mt-4 border-t border-gray-200 dark:border-gray-700 pt-4">
      <h4 class="text-md font-semibold text-gray-800 dark:text-gray-200 mb-2">Summary:</h4>
      @if (state() === 'success') {
        <p class="text-sm text-gray-700 dark:text-gray-300 whitespace-pre-wrap">{{ summary() }}</p>
      }
      @if (state() === 'error') {
        <p class="text-sm text-red-500">{{ summary() }}</p>
      }
    </div>
  }
</div>
